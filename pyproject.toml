[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warsaw-public-transport-monitor"
version = "0.2.0"
description = "Warsaw Public Transit High-Frequency Delay Ingestion, Spatiotemporal Fusion, and xAI Modeling Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Warsaw Public Transport Monitor Project" }
]
dependencies = [
    "requests>=2.31.0",
    "protobuf>=4.25.0",
    "gtfs-realtime-bindings>=1.0.0",
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "tenacity>=8.2.0",
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
analysis = [
    "osmnx>=1.9.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
]
modeling = [
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "statsmodels>=0.14.0",
    "linearmodels>=6.0",
    "shap>=0.45.0",
    "PyALE>=1.1.0",
    "dice-ml>=0.11",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb", "catboost_info", "cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (Flake8)
    "W",    # pycodestyle warnings (Flake8)
    "F",    # Pyflakes (Flake8)
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "PL",   # Pylint (convention, error, refactor, warning)
]
ignore = [
    "E501",     # Line length is handled by ruff format
    "E712",     # Allow df[col == False] comparisons in Pandas/NumPy expressions
    "PLR0913",  # Too many arguments (standard in data science/ML pipelines)
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements
    "PLR0912",  # Too many branches
    "PLR0917",  # Too many positional arguments
    "PLR2004",  # Magic value comparison
    "PLC0415",  # Import outside top-level (standard for lazy ML imports like lightgbm/shap)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyrefly]
search-path = ["."]

