services:
  historian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warsaw_historian_daemon
    command: python3 historian_daemon.py
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - UM_WARSAW_API_KEY=${UM_WARSAW_API_KEY:-}
      - UM_WARSAW_API_URL=${UM_WARSAW_API_URL:-https://dane.um.warszawa.pl/api/action/get_ztm_lokalizacja_pojazdow}
      - HISTORIAN_HEARTBEAT_URL=${HISTORIAN_HEARTBEAT_URL:-}
      - HISTORIAN_POLL_PERIOD_S=${HISTORIAN_POLL_PERIOD_S:-10}
      - HISTORIAN_DATA_DIR=${HISTORIAN_DATA_DIR:-data/historian}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
